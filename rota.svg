<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 64" width="800" height="64" role="img" aria-label="Yolculuk rotası">
<title>Yolculuk rotası</title>
<style>
.dots{animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-10}}
.bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){.dots,.bob{animation:none}}
</style>
<defs><g id="plane"><path transform="scale(.75)" d="M11,0 C11,-1.2 9.8,-1.8 8.5,-1.8 L3.5,-1.8 L-2.5,-9 L-5,-9 L-1.8,-1.8 L-6.5,-1.8 L-9,-4.8 L-11,-4.8 L-9.6,0 L-11,4.8 L-9,4.8 L-6.5,1.8 L-1.8,1.8 L-5,9 L-2.5,9 L3.5,1.8 L8.5,1.8 C9.8,1.8 11,1.2 11,0 Z"/></g></defs>
<path class="dots" d="M28,52 C220,0 580,0 772,52" fill="none" stroke="#7cc4fa" stroke-opacity=".6" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 9"/>
<path d="M28,52 C220,0 580,0 772,52" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="749.99 749.99" stroke-dashoffset="749.99">
<animate attributeName="stroke-dashoffset" values="749.99;0;0" keyTimes="0;.7;1" dur="7s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.8;.95;1" dur="7s" repeatCount="indefinite"/>
</path>
<ellipse cx="28" cy="52" rx="3" ry="1.5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0"><animate attributeName="rx" values="3;3;15;15" keyTimes="0;0.02;0.17;1" dur="7s" repeatCount="indefinite"/><animate attributeName="ry" values="1.5;1.5;5;5" keyTimes="0;0.02;0.17;1" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0;0" keyTimes="0;0.02;0.17;1" dur="7s" repeatCount="indefinite"/></ellipse><g transform="translate(28 52)"><g class="bob"><path d="M0,0 C-2,-4 -7,-8 -7,-13 A7,7 0 1,1 7,-13 C7,-8 2,-4 0,0 Z" fill="#38bdf8"/><circle cy="-13" r="2.6" fill="#0b2a63"/></g></g>
<ellipse cx="772" cy="52" rx="3" ry="1.5" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0"><animate attributeName="rx" values="3;3;15;15" keyTimes="0;0.7;0.85;1" dur="7s" repeatCount="indefinite"/><animate attributeName="ry" values="1.5;1.5;5;5" keyTimes="0;0.7;0.85;1" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0;0" keyTimes="0;0.7;0.85;1" dur="7s" repeatCount="indefinite"/></ellipse><g transform="translate(772 52)"><g class="bob"><path d="M0,0 C-2,-4 -7,-8 -7,-13 A7,7 0 1,1 7,-13 C7,-8 2,-4 0,0 Z" fill="#fbbf24"/><circle cy="-13" r="2.6" fill="#0b2a63"/></g></g>
<use xlink:href="#plane" fill="#ffffff" opacity="0">
<animateMotion path="M28,52 C220,0 580,0 772,52" rotate="auto" keyPoints="0;1;1" keyTimes="0;.7;1" calcMode="linear" dur="7s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.66;.72;1" dur="7s" repeatCount="indefinite"/>
</use>
</svg>
