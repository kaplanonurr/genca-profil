<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Veri bilimi">
<title>Veri bilimi</title>
<style>
.b{transform-box:fill-box;transform-origin:50% 100%;animation:grow 2.6s ease-in-out infinite}
@keyframes grow{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.tr{stroke-dasharray:34;animation:draw 3.2s ease-in-out -1.4s infinite}
@keyframes draw{0%{stroke-dashoffset:34;opacity:1}40%,82%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.dot{animation:pop 3.2s ease-in-out -1.4s infinite}
@keyframes pop{0%,36%{opacity:0}44%,82%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.b,.tr,.dot{animation:none}}
</style>
<rect x=".75" y=".75" width="46.5" height="46.5" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#7cc4fa" stroke-opacity=".5" stroke-width="1.5"/>
<line x1="10" y1="37.5" x2="38" y2="37.5" stroke="#7cc4fa" stroke-opacity=".5" stroke-width="1.5" stroke-linecap="round"/>
<rect class="b" x="12" y="25" width="5" height="11" rx="1.5" fill="#5fa0ea" style="animation-delay:0s"/><rect class="b" x="19" y="19" width="5" height="17" rx="1.5" fill="#7cc4fa" style="animation-delay:-0.4s"/><rect class="b" x="26" y="23" width="5" height="13" rx="1.5" fill="#38bdf8" style="animation-delay:-0.8s"/><rect class="b" x="33" y="15" width="5" height="21" rx="1.5" fill="#bfe3ff" style="animation-delay:-1.2s"/>
<polyline class="tr" points="11,25 19,19 27,22 37,11" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="dot" cx="37" cy="11" r="2.4" fill="#fbbf24"/>
</svg>
