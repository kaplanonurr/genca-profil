<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 258 30" width="258" height="30" role="img" aria-label="Dil seviyesi B1 (A1–C2 ölçeği)">
<title>Dil seviyesi B1 (A1–C2 ölçeği)</title>
<style>
text{font-family:'SF Mono', Menlo, Monaco, 'Lucida Console', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace;font-size:10px;text-anchor:middle}
.now{fill:#ffffff;font-weight:700}
.done{fill:#bfe3ff;fill-opacity:.75}
.todo{fill:#7cc4fa;fill-opacity:.45}
.ring{animation:ring 2s ease-in-out infinite}
@keyframes ring{0%,100%{opacity:.25}50%{opacity:1}}
.sh{animation:sh 4s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(-24px)}35%,100%{transform:translateX(134.6px)}}
@media (prefers-reduced-motion: reduce){.ring,.sh{animation:none}}
</style>
<defs>
<linearGradient id="lv" gradientUnits="userSpaceOnUse" x1="3" y1="0" x2="126.6" y2="0"><stop offset="0" stop-color="#2f7fe0"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<clipPath id="on"><rect x="3" y="4" width="38" height="9" rx="4.5"/><rect x="45.8" y="4" width="38" height="9" rx="4.5"/><rect x="88.6" y="4" width="38" height="9" rx="4.5"/></clipPath>
</defs>
<g fill="#ffffff" fill-opacity=".08" stroke="#7cc4fa" stroke-opacity=".35"><rect x="131.4" y="4" width="38" height="9" rx="4.5"/><rect x="174.2" y="4" width="38" height="9" rx="4.5"/><rect x="217" y="4" width="38" height="9" rx="4.5"/></g>
<g fill="url(#lv)"><rect x="3" y="4" width="38" height="9" rx="4.5"/><rect x="45.8" y="4" width="38" height="9" rx="4.5"/><rect x="88.6" y="4" width="38" height="9" rx="4.5"/></g>
<g clip-path="url(#on)"><path class="sh" d="M6,0 h10 l-6,17 h-10 z" fill="#ffffff" fill-opacity=".55"/></g>
<rect class="ring" x="86.1" y="1.5" width="43" height="14" rx="7" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
<text x="22" y="27" class="done">A1</text><text x="64.8" y="27" class="done">A2</text><text x="107.6" y="27" class="now">B1</text><text x="150.4" y="27" class="todo">B2</text><text x="193.2" y="27" class="todo">C1</text><text x="236" y="27" class="todo">C2</text>
